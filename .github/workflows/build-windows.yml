name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python instellen (nodig voor native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies installeren
        run: npm install
        env:
          npm_config_python: python

      - name: Windows installer bouwen
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoApp-Windows
          path: dist/*.exe
          retention-days: 30

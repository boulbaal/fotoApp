name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 3.12 heeft geen distutils meer; 3.11 wel

      - name: Dependencies installeren
        run: npm install
        env:
          npm_config_python: python
          npm_config_msvs_version: '2022'

      - name: Windows installer bouwen en publiceren
        run: npm run build:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer uploaden als artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: FotoApp-Windows
          path: dist/*.exe
          retention-days: 30
